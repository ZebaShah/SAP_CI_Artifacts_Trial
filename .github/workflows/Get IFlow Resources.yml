name: Get IFlow Resources

on:
  push:
    branches:
      - DEV

jobs:
  get-iflow-resources:
    runs-on: ubuntu-latest

    env:
      IFLOW_ID: "IFLOW_github_test1"
      IFLOW_VERSION: "1.0.0"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read CPI Service Key
        env:
          CPI_SERVICE_KEY: ${{ secrets.CPIAPISERVICEKEYCREDENTIALSID }}
        run: |
          printf '%s' "$CPI_SERVICE_KEY" > cpi-service-key.json

      - name: Extract Service Key Values
        run: |
          echo "CLIENT_ID=$(jq -r '.oauth.clientid' cpi-service-key.json)" >> $GITHUB_ENV
          echo "CLIENT_SECRET=$(jq -r '.oauth.clientsecret' cpi-service-key.json)" >> $GITHUB_ENV
          echo "TOKEN_URL=$(jq -r '.oauth.tokenurl' cpi-service-key.json)" >> $GITHUB_ENV
          echo "CPI_URL=$(jq -r '.oauth.url' cpi-service-key.json)" >> $GITHUB_ENV

      - name: Get OAuth Token
        run: |
          TOKEN_RESPONSE=$(curl -sS \
            -X POST "$TOKEN_URL?grant_type=client_credentials" \
            -u "$CLIENT_ID:$CLIENT_SECRET" \
            -H "Content-Type: application/x-www-form-urlencoded")

          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token')

          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
            echo "OAuth failed"
            exit 1
          fi

          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV

      - name: Get IFlow Resources
        run: |
          echo "================================"
          echo "IFLOW Resources"
          echo "================================"

          curl -sS \
            -X GET "$CPI_URL/api/v1/IntegrationDesigntimeArtifacts(Id='$IFLOW_ID',Version='$IFLOW_VERSION')/Resources" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Accept: application/json" \
            | jq .
