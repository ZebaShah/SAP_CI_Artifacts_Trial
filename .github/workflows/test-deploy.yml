name: Test Deploy Trigger

on:
  push:
    branches:
      - DEV

jobs:
  detect-changes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Show Changed Files
        run: |
          echo "Changed files:"
          git diff --name-only HEAD~1 HEAD
