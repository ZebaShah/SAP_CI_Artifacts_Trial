name: DEV Deployment

on:
  push:
    branches:
      - DEV

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Check Secrets Exist
        run: |
          [ -n "${{ secrets.CLIENT_ID }}" ] && echo "CLIENT_ID OK" || echo "CLIENT_ID MISSING"
          [ -n "${{ secrets.CLIENT_SECRET }}" ] && echo "CLIENT_SECRET OK" || echo "CLIENT_SECRET MISSING"
          [ -n "${{ secrets.TOKEN_URL }}" ] && echo "TOKEN_URL OK" || echo "TOKEN_URL MISSING"

      - name: Check URL Format
        run: |
          echo "URL Length: $(echo -n '${{ secrets.TOKEN_URL }}' | wc -c)"
          echo "URL Start:"
          echo "${{ secrets.TOKEN_URL }}" | cut -c1-30
          echo "URL End:"
          echo "${{ secrets.TOKEN_URL }}" | rev | cut -c1-20 | rev
