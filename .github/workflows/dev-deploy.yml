name: DEV Deployment

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Check Secrets Exist
        run: |
          if [ -n "${{ secrets.CLIENT_ID }}" ]; then
            echo "CLIENT_ID OK"
          else
            echo "CLIENT_ID MISSING"
          fi

          if [ -n "${{ secrets.CLIENT_SECRET }}" ]; then
            echo "CLIENT_SECRET OK"
          else
            echo "CLIENT_SECRET MISSING"
          fi

          if [ -n "${{ secrets.TOKEN_URL }}" ]; then
            echo "TOKEN_URL OK"
          else
            echo "TOKEN_URL MISSING"
          fi

      - name: Get SAP Access Token
        run: |
          response=$(curl -s --request POST "${{ secrets.TOKEN_URL }}" \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=${{ secrets.CLIENT_ID }}" \
            --data-urlencode "client_secret=${{ secrets.CLIENT_SECRET }}")

          echo "$response"

          if echo "$response" | grep -q "access_token"; then
            echo "SUCCESS - SAP token received"
          else
            echo "FAILED - Unable to get SAP token"
            exit 1
          fi
