name: DEV Deployment

on:
  push:
    branches:
      - DEV

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Get SAP Access Token
        run: |
          AUTH=$(printf "%s:%s" "${{ secrets.CLIENT_ID }}" "${{ secrets.CLIENT_SECRET }}" | base64 -w 0)

          response=$(curl -s \
            -X POST "${{ secrets.TOKEN_URL }}" \
            -H "Authorization: Basic $AUTH" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials")

          echo "$response"

          if echo "$response" | grep -q "access_token"; then
            echo "SUCCESS - SAP token received"
          else
            echo "FAILED - Unable to get SAP token"
            exit 1
          fi
