name: DEV Deployment

on:
  push:
    branches:
      - DEV

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Check Secret Lengths
        run: |
          echo "CLIENT_ID length: $(printf '%s' '${{ secrets.CLIENT_ID }}' | wc -c)"
          echo "CLIENT_SECRET length: $(printf '%s' '${{ secrets.CLIENT_SECRET }}' | wc -c)"
          echo "TOKEN_URL length: $(printf '%s' '${{ secrets.TOKEN_URL }}' | wc -c)"

      - name: Check For Hidden Characters
        run: |
          echo "CLIENT_ID"
          printf '%s' '${{ secrets.CLIENT_ID }}' | od -An -tx1 | tail -1

          echo "CLIENT_SECRET"
          printf '%s' '${{ secrets.CLIENT_SECRET }}' | od -An -tx1 | tail -1

          echo "TOKEN_URL"
          printf '%s' '${{ secrets.TOKEN_URL }}' | od -An -tx1 | tail -1
