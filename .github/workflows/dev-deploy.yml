name: DEV Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - DEV

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find Changed iFlows
        run: |
          echo "================================"
          echo "Changed iFlows in this deployment"
          echo "================================"

          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep '\.iflw$' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No iFlows changed"
          else
            echo "$CHANGED_FILES"
          fi

      - name: Check Secrets Exist
        run: |
          if [ -n "${{ secrets.IS_CLIENT_ID }}" ]; then
            echo "CLIENT_ID OK"
          else
            echo "CLIENT_ID MISSING"
          fi

          if [ -n "${{ secrets.IS_CLIENT_SECRET }}" ]; then
            echo "CLIENT_SECRET OK"
          else
            echo "CLIENT_SECRET MISSING"
          fi

          if [ -n "${{ secrets.IS_TOKEN_URL }}" ]; then
            echo "TOKEN_URL OK"
          else
            echo "TOKEN_URL MISSING"
          fi

      - name: Get SAP Access Token
        run: |
          response=$(curl -s --request POST "${{ secrets.IS_TOKEN_URL }}" \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=${{ secrets.IS_CLIENT_ID }}" \
            --data-urlencode "client_secret=${{ secrets.IS_CLIENT_SECRET }}")

          echo "$response"

          if echo "$response" | grep -q "access_token"; then
            echo "SUCCESS - SAP token received"
          else
            echo "FAILED - Unable to get SAP token"
            exit 1
          fi

      - name: Simulate Deployment
        run: |
          echo "Deploying changed artifacts"
