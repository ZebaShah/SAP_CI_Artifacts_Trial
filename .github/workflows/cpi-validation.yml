name: SAP CPI iFlow Validation

on:
  push:
    branches:
      - 'feature/**'

jobs:
  validate-iflow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate iFlow Naming Convention
        run: |

          echo "Checking iFlow names..."

          files=$(find . -name "*.iflw")

          if [ -z "$files" ]; then
            echo "No .iflw files found"
            exit 0
          fi

          for file in $files
          do
            filename=$(basename "$file" .iflw)

            if ! echo "$filename" | grep -E '^IFLOW_'; then
              echo "ERROR: Invalid iFlow name -> $filename"
              echo "Expected naming convention: IFLOW_*"
              exit 1
            fi
          done

          echo "All iFlows passed validation"
