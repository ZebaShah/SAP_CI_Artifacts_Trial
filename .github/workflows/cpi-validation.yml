name: SAP CPI iFlow Validation

on:
  push:
    branches:
      - 'feature/**'

jobs:
  validate-iflow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Changed iFlows Only
        run: |

          echo "Checking changed iFlows..."

          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep '\.iflw$' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No changed iFlow files found"
            exit 0
          fi

          echo "Changed iFlows:"
          echo "$CHANGED_FILES"

          for file in $CHANGED_FILES
          do

            filename=$(basename "$file" .iflw)

            if ! echo "$filename" | grep -E '^IFLOW_'; then
              echo "ERROR: Invalid iFlow name -> $filename"
              echo "Expected naming convention: IFLOW_*"
              exit 1
            fi

          done

          echo "All changed iFlows passed validation"
