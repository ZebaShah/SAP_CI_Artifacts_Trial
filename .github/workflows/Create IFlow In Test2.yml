name: Create Or Update IFlow In Test2

on:
  push:
    branches:
      - DEV

jobs:
  create-or-update-iflow:
    runs-on: ubuntu-latest

    env:
      IFLOW_ID: "IFLOW_github_test1_COPY"
      TARGET_PACKAGE: "Test2"
      IFLOW_VERSION: "1.0.0"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read CPI Service Key
        env:
          CPI_SERVICE_KEY: ${{ secrets.CPIAPISERVICEKEYCREDENTIALSID }}
        run: |
          printf '%s' "$CPI_SERVICE_KEY" > cpi-service-key.json

      - name: Extract Service Key Values
        run: |
          echo "CLIENT_ID=$(jq -r '.oauth.clientid' cpi-service-key.json)" >> $GITHUB_ENV
          echo "CLIENT_SECRET=$(jq -r '.oauth.clientsecret' cpi-service-key.json)" >> $GITHUB_ENV
          echo "TOKEN_URL=$(jq -r '.oauth.tokenurl' cpi-service-key.json)" >> $GITHUB_ENV
          echo "CPI_URL=$(jq -r '.oauth.url' cpi-service-key.json)" >> $GITHUB_ENV

      - name: Get OAuth Token
        run: |
          TOKEN_RESPONSE=$(curl -sS \
            -X POST "$TOKEN_URL?grant_type=client_credentials" \
            -u "$CLIENT_ID:$CLIENT_SECRET" \
            -H "Content-Type: application/x-www-form-urlencoded")

          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token')

          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
            echo "OAuth failed"
            exit 1
          fi

          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV

      - name: Fetch CSRF Token
        run: |
          curl -sS \
            -D headers.txt \
            -c cookies.txt \
            -X GET "$CPI_URL/api/v1/IntegrationDesigntimeArtifacts" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "X-CSRF-Token: Fetch" \
            -o /dev/null

          TOKEN=$(grep -i x-csrf-token headers.txt | awk '{print $2}' | tr -d '\r')

          echo "CSRF_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Create CPI Compatible ZIP
        run: |
          cd IFLOW_github_test1
          zip -r ../iflow.zip .
          cd ..

      - name: Base64 Encode Artifact
        run: |
          base64 -w 0 iflow.zip > artifact.b64

      - name: Create Payload
        run: |
          ARTIFACT_CONTENT=$(cat artifact.b64)

          cat > payload.json <<EOF
          {
            "Name": "${IFLOW_ID}",
            "Id": "${IFLOW_ID}",
            "PackageId": "${TARGET_PACKAGE}",
            "ArtifactContent": "${ARTIFACT_CONTENT}"
          }
          EOF

      - name: Check If Artifact Exists
        run: |
          STATUS=$(curl -sS \
            -o exists.txt \
            -w "%{http_code}" \
            -X GET "$CPI_URL/api/v1/IntegrationDesigntimeArtifacts(Id='${IFLOW_ID}',Version='${IFLOW_VERSION}')" \
            -H "Authorization: Bearer $ACCESS_TOKEN")

          echo "ARTIFACT_STATUS=$STATUS" >> $GITHUB_ENV

          echo "Artifact Status: $STATUS"

      - name: Create New Artifact
        if: env.ARTIFACT_STATUS == '404'
        run: |
          curl -sS \
            -b cookies.txt \
            -X POST "$CPI_URL/api/v1/IntegrationDesigntimeArtifacts" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "X-CSRF-Token: $CSRF_TOKEN" \
            -H "Content-Type: application/json" \
            -d @payload.json

      - name: Update Existing Artifact
        if: env.ARTIFACT_STATUS == '200'
        run: |
          curl -sS \
            -b cookies.txt \
            -X PUT "$CPI_URL/api/v1/IntegrationDesigntimeArtifacts(Id='${IFLOW_ID}',Version='${IFLOW_VERSION}')" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "X-CSRF-Token: $CSRF_TOKEN" \
            -H "Content-Type: application/json" \
            -d @payload.json
